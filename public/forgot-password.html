<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Recovery | ROF Asset Management</title><link rel="stylesheet" href="css/style.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f6fa;font-family:Inter,system-ui,"Segoe UI",sans-serif;color:#172033;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,460px)}.brand{text-align:center;margin-bottom:22px}.brand img{width:150px;height:105px;object-fit:contain;background:#fff;border-radius:12px;padding:8px}.brand h1{font-size:23px;margin:12px 0 4px}.brand p{margin:0;color:#64748b}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:28px;box-shadow:0 14px 40px #0f172a12}.card h2{margin:0 0 8px}.card p{color:#64748b;line-height:1.5}label{display:block;font-weight:600;margin:16px 0 7px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}button{width:100%;margin-top:16px;padding:13px;background:#1d4ed8;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#msg{margin-top:14px;font-size:14px;white-space:pre-wrap}.back{display:block;text-align:center;margin-top:18px;color:#475569;text-decoration:none}
</style></head><body><main class="wrap"><header class="brand"><img src="images/rof-logo.png" alt="ROF logo"><h1>Asset Management</h1><p>IT Department</p></header><section class="card"><h2>Reset Password</h2><p id="intro">Enter your username. We’ll send a verification OTP to your registered email address.</p><form id="requestForm"><label for="username">Username</label><input id="username" autocomplete="username" required minlength="3"><button>Send OTP</button></form><form id="verifyForm" hidden><label for="otp">6-digit OTP</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button>Verify OTP</button></form><form id="resetForm" hidden><label for="password">New password</label><input id="password" type="password" minlength="10" autocomplete="new-password" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required><button>Set New Password</button></form><div id="msg" role="status"></div></section><a class="back" href="/login.html">← Back to login</a></main><script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);let resetToken=params.get('token')||'', username='';const adminMode=params.get('mode')==='admin-reset';
function message(text,ok=false){$('msg').textContent=text;$('msg').style.color=ok?'#047857':'#b91c1c'}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Request failed');return d}
if(resetToken){$('requestForm').hidden=true;$('verifyForm').hidden=true;$('resetForm').hidden=false;$('intro').textContent='Choose a new password for your account. Reset links expire automatically.'}
$('requestForm').addEventListener('submit',async e=>{e.preventDefault();username=$('username').value.trim();try{const d=await post('/api/auth/forgot-password/request-otp',{username});$('requestForm').hidden=true;$('verifyForm').hidden=false;$('intro').textContent='Enter the OTP sent to your registered email. It expires in 5 minutes.';message(d.message,true)}catch(err){message(err.message)}});
$('verifyForm').addEventListener('submit',async e=>{e.preventDefault();try{const d=await post('/api/auth/forgot-password/verify-otp',{username,otp:$('otp').value.trim()});resetToken=d.resetToken;$('verifyForm').hidden=true;$('resetForm').hidden=false;$('intro').textContent='OTP verified. Choose a new password.';message(d.message,true)}catch(err){message(err.message)}});
$('resetForm').addEventListener('submit',async e=>{e.preventDefault();const password=$('password').value;if(password!==$('confirm').value)return message('Passwords do not match.');try{const d=adminMode?await post('/api/users/complete-email-reset',{token:resetToken,password}):await post('/api/auth/forgot-password/reset',{token:resetToken,password});$('resetForm').hidden=true;message(d.message,true);setTimeout(()=>location.href='/login.html',1800)}catch(err){message(err.message)}});
</script></body></html>
