<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | ROF Asset Management
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        /* =====================================================
           LOGIN PAGE
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        body.login-body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                #f4f7fb;

        }


        .login-wrapper {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }


        /* =====================================================
           LOGIN CONTAINER
        ===================================================== */

        .login-container {

            width: 100%;

            max-width: 440px;

        }


        /* =====================================================
           BRAND
        ===================================================== */

        .login-brand {

            text-align: center;

            margin-bottom: 28px;

        }


        .login-logo {

            width: 150px;

            height: 110px;

            margin: 0 auto 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            background: #ffffff;

            padding: 10px;

            box-shadow:
                0 8px 22px
                rgba(
                    15,
                    23,
                    42,
                    0.12
                );

        }


        .login-brand h1 {

            margin: 0 0 5px;

            color:
                #172033;

            font-size: 24px;

            font-weight: 700;

        }


        .login-brand p {

            margin: 0;

            color:
                #64748b;

            font-size: 14px;

        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {

            background:
                #ffffff;

            border:
                1px solid
                #e3e8f0;

            border-radius: 14px;

            padding: 30px;

            box-shadow:
                0 12px 35px
                rgba(
                    15,
                    23,
                    42,
                    0.08
                );

        }


        .login-card h2 {

            margin: 0 0 6px;

            color:
                #172033;

            font-size: 21px;

            font-weight: 700;

        }


        .login-description {

            margin: 0 0 25px;

            color:
                #64748b;

            font-size: 14px;

            line-height: 1.5;

        }


        /* =====================================================
           FORM
        ===================================================== */

        .login-field {

            margin-bottom: 18px;

        }


        .login-field label {

            display: block;

            margin-bottom: 7px;

            color:
                #374151;

            font-size: 14px;

            font-weight: 600;

        }


        .login-input-wrapper {

            position: relative;

        }


        .login-input-wrapper input {

            width: 100%;

            height: 46px;

            padding:
                0 13px;

            border:
                1px solid
                #dbe2eb;

            border-radius: 8px;

            background:
                #ffffff;

            color:
                #1f2937;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

        }


        .login-input-wrapper input:focus {

            border-color:
                #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.08
                );

        }


        /* =====================================================
           PASSWORD TOGGLE
        ===================================================== */

        .password-wrapper input {

            padding-right: 72px;

        }


        .password-toggle {

            position: absolute;

            right: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color:
                #64748b;

            font-family: inherit;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

            padding: 5px;

        }


        .password-toggle:hover {

            color:
                #2563eb;

        }


        /* =====================================================
           REMEMBER ME
        ===================================================== */

        .login-options {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin:
                4px 0 22px;

        }


        .remember-me {

            display: flex;

            align-items: center;

            gap: 8px;

            color:
                #64748b;

            font-size: 13px;

            cursor: pointer;

        }


        .remember-me input {

            width: 15px;

            height: 15px;

            accent-color:
                #2563eb;

            cursor: pointer;

        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {

            width: 100%;

            height: 46px;

            border: none;

            border-radius: 8px;

            background:
                #2563eb;

            color:
                #ffffff;

            font-family: inherit;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease;

        }


        .login-button:hover {

            background:
                #1d4ed8;

        }


        .login-button:active {

            transform:
                translateY(1px);

        }


        .login-button:disabled {

            opacity: 0.65;

            cursor: not-allowed;

        }


        /* =====================================================
           ERROR MESSAGE
        ===================================================== */

        .login-message {

            display: none;

            margin-bottom: 18px;

            padding:
                11px 13px;

            border-radius: 7px;

            font-size: 13px;

            line-height: 1.4;

        }


        .login-message.error {

            display: block;

            background:
                #fef2f2;

            border:
                1px solid
                #fecaca;

            color:
                #b91c1c;

        }


        .login-message.success {

            display: block;

            background:
                #ecfdf5;

            border:
                1px solid
                #a7f3d0;

            color:
                #047857;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .login-footer {

            margin-top: 22px;

            text-align: center;

            color:
                #94a3b8;

            font-size: 12px;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (
            max-width: 500px
        ) {

            .login-wrapper {

                padding: 20px;

            }


            .login-card {

                padding: 24px 20px;

            }


            .login-brand h1 {

                font-size: 22px;

            }

        }

    </style>

</head>


<body class="login-body">


<div class="login-wrapper">


    <div class="login-container">


        <!-- =================================================
             BRAND
        ================================================== -->

        <div class="login-brand">


            <div class="login-logo">
                <img src="images/rof-logo.png" alt="ROF Realty Opportunity Future logo" style="display:block;width:100%;height:100%;object-fit:contain;" />
            </div>


            <h1>
                Asset Management
            </h1>


            <p>
                IT Department
            </p>


        </div>


        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <div class="login-card">


            <h2>
                Welcome Back
            </h2>


            <p class="login-description">
                Sign in to access the ROF Asset Management System.
            </p>


            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div
                id="loginMessage"
                class="login-message"
            ></div>

            <div style="text-align:right;margin:0 0 14px"><a href="/forgot-password.html" style="color:#526b85;font-size:14px;text-decoration:none;font-weight:600">Forgot Password?</a></div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                autocomplete="on"
            >


                <!-- USERNAME -->

                <div class="login-field">


                    <label
                        for="username"
                    >
                        Username
                    </label>


                    <div
                        class="login-input-wrapper"
                    >

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>


                </div>


                <!-- PASSWORD -->

                <div class="login-field">


                    <label
                        for="password"
                    >
                        Password
                    </label>


                    <div
                        class="login-input-wrapper password-wrapper"
                    >

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            id="passwordToggle"
                            class="password-toggle"
                        >
                            Show
                        </button>


                    </div>


                </div>


                <!-- OPTIONS -->

                <div class="login-options">


                    <label
                        class="remember-me"
                    >

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    Login

                </button>


            </form>


        </div>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="login-footer">

            ROF Asset Management System

        </div>


    </div>


</div>


<script>


    // =====================================================
    // ELEMENTS
    // =====================================================

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const usernameInput =
        document.getElementById(
            "username"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const passwordToggle =
        document.getElementById(
            "passwordToggle"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const loginMessage =
        document.getElementById(
            "loginMessage"
        );


    const rememberMe =
        document.getElementById(
            "rememberMe"
        );


    // =====================================================
    // SHOW / HIDE PASSWORD
    // =====================================================

    passwordToggle.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

                passwordToggle.textContent =
                    "Hide";

            }
            else {

                passwordInput.type =
                    "password";

                passwordToggle.textContent =
                    "Show";

            }

        }
    );


    // =====================================================
    // SHOW MESSAGE
    // =====================================================

    function showMessage(
        message,
        type
    ) {

        loginMessage.textContent =
            message;

        loginMessage.className =
            "login-message " +
            type;

    }


    // =====================================================
    // REMEMBER USERNAME
    // =====================================================

    const savedUsername =
        localStorage.getItem(
            "rof_saved_username"
        );


    if (savedUsername) {

        usernameInput.value =
            savedUsername;

        rememberMe.checked =
            true;

    }


    // =====================================================
    // LOGIN
    // =====================================================

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const username =
                usernameInput.value.trim();


            const password =
                passwordInput.value;


            if (!username) {

                showMessage(
                    "Please enter your username.",
                    "error"
                );

                usernameInput.focus();

                return;

            }


            if (!password) {

                showMessage(
                    "Please enter your password.",
                    "error"
                );

                passwordInput.focus();

                return;

            }


            // Disable button

            loginButton.disabled =
                true;


            loginButton.textContent =
                "Signing in...";


            loginMessage.className =
                "login-message";


            try {


                /*
                 * Backend endpoint.
                 *
                 * Isko next step mein
                 * Express authentication
                 * route se connect karenge.
                 */

                const response =
                    await fetch(
                        "/api/auth/login",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    username:
                                        username,

                                    password:
                                        password

                                })

                        }
                    );


                let data = null;


                try {

                    data =
                        await response.json();

                }
                catch (jsonError) {

                    data = null;

                }


                if (!response.ok) {

                    throw new Error(

                        data &&
                        data.message

                            ? data.message

                            : "Invalid username or password."

                    );

                }


                if (
                    !data ||
                    !data.success
                ) {

                    throw new Error(

                        data &&
                        data.message

                            ? data.message

                            : "Login failed."

                    );

                }


                // =========================================
                // REMEMBER USERNAME
                // =========================================

                if (
                    rememberMe.checked
                ) {

                    localStorage.setItem(
                        "rof_saved_username",
                        username
                    );

                }
                else {

                    localStorage.removeItem(
                        "rof_saved_username"
                    );

                }


                // =========================================
                // SUCCESS
                // =========================================

                sessionStorage.setItem("rof_session_active", "1");

                showMessage(
                    "Login successful. Redirecting...",
                    "success"
                );


                /*
                 * Backend authentication successful.
                 */

                setTimeout(
                    function () {

                        window.location.href =
                            "index.html";

                    },
                    500
                );


            }


            catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                showMessage(

                    error.message ||
                    "Unable to login. Please try again.",

                    "error"

                );

            }


            finally {

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

            }

        }
    );

</script>


</body>

</html>
